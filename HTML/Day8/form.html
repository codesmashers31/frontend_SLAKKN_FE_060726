<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
<main>
    <div>
        <form  method="post">
            <label>Enter the Name</label>
            <input type="text" placeholder="Enter the value" name="username" required />
            <label>Enter the Mobile</label>
            <input type="tel" placeholder="Enter 10 digit" name="usermobile" required />
            <label>Enter the Email</label>
            <input type="text" placeholder="Enter the value" name="useremail" required />
            <label for="userage">Enter the Age</label>
            <input type="text"  id="userage" placeholder="Above 18 Only" name="userage" required />
            <label>Choose the Genter</label>
            <input type="radio"  name="gender" required />Mela
            <input type="radio"  name="gender" required />Femela

          <label>Select Course</label>
            <select name="course" id="">
                <option value="">Select One...</option>
                <option value="1">HTML</option>
                <option value="2">CSS</option>
            </select>


            <label for="userskills">Skills</label>
            <input type="checkbox" name="userskills" id="userskills" >HTML
            <input type="checkbox" name="userskills" id="userskills" >CSS
            <input type="checkbox" name="userskills" id="userskills" >JS
            <input type="checkbox" name="userskills" id="userskills" >REACT
            <label for="">User Notes</label>
            <textarea name="usernotes" id="">

            </textarea>

        </form>
    </div>
</main>



</body>

</html>
