<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <section>
        <h1>Register</h1>
        <div>
            <form id="myform">
                <input type="text" id="username" placeholder="Enter the Name" />
                <input type="email" id="useremail" placeholder="Enter the Email" />
                <input type="password" id="userpassword" placeholder="Enter the Password" />
                <button id="registerbtn">Register</button>
            </form>
            <p>If your Already have Account? <a href="login.html">Login</a></p>
        </div>
    </section>

    <section>
        <table border="1" cellpadding="10" cellspacing="3">
            <thead>
                <th>UserId</th>
                <th>Name</th>
                <th>Email</th>
            </thead>
            <tbody id="showingdata">
                
            </tbody>
        </table>
    </section>


    <script src="assets/js/index.js"></script>
</body>
</html>
